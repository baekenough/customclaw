services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: customclaw
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  opensearch:
    image: ghcr.io/baekenough/customclaw-opensearch:latest
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: ghcr.io/baekenough/customclaw-airflow:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=customclaw"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ${HOST_WORKSPACE_PATH}:/home/airflow/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CLAUDE_CLI_BINARY}:/home/airflow/.local/bin/claude:ro
      - ${CLAUDE_CONFIG_DIR}:/home/airflow/.claude
      - ./docker/bot-claude-settings.json:/home/airflow/.claude/settings.json:ro
      - ${CLAUDE_CREDENTIALS_FILE}:/home/airflow/.claude.json
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.default
      AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: ${AIRFLOW_API_USER}
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: ${AIRFLOW_API_PASSWORD}
      AIRFLOW__SIMPLE_AUTH_MANAGER__ALL_ADMINS: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HOME: /home/airflow

  slack-bolt:
    image: ghcr.io/baekenough/customclaw-slack-bolt:latest
    restart: unless-stopped
    stop_grace_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=customclaw"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bots:/app/bots
      - repos:${CONTAINER_HOME}/workspace
    environment:
      DATABASE_DSN: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/customclaw
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}

  worker:
    image: ghcr.io/baekenough/customclaw-slack-bolt:latest
    restart: unless-stopped
    stop_grace_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=customclaw"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ./bots:/app/bots
      - ${HOST_WORKSPACE_PATH}:${CONTAINER_HOME}/workspace
      - ${CLAUDE_CONFIG_DIR}:${CONTAINER_HOME}/.claude
      - ./docker/bot-claude-settings.json:${CONTAINER_HOME}/.claude/settings.json:ro
      - ${CLAUDE_CREDENTIALS_FILE}:${CONTAINER_HOME}/.claude.json
      - ${CLAUDE_CLI_BINARY}:/usr/local/bin/claude:ro
      - ${CODEX_PKG_DIR}:/usr/lib/node_modules/@openai/codex:ro
      - ${CODEX_CONFIG_DIR}:${CONTAINER_HOME}/.codex
    environment:
      DATABASE_DSN: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/customclaw
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      AIRFLOW_API_URL: http://airflow:8080/api/v2
      AIRFLOW_API_USER: ${AIRFLOW_API_USER}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD}
      REDIS_CONSUMER_GROUP: customclaw-workers
      MERGE_WINDOW_SECONDS: "5"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      CUSTOMCLAW_SLACK_BOT_TOKEN: ${CUSTOMCLAW_SLACK_BOT_TOKEN}
      CREDENTIAL_ALERT_CHANNEL: ${CREDENTIAL_ALERT_CHANNEL:-C0AMBNY135Z}
    command: python -m slack_bot.worker

  git-worker:
    image: ghcr.io/baekenough/customclaw-slack-bolt:latest
    restart: unless-stopped
    stop_grace_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=customclaw"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - repos:${CONTAINER_HOME}/workspace
    environment:
      REDIS_URL: redis://redis:6379
    command: python -m slack_bot.git_worker

  web-ui:
    image: ghcr.io/baekenough/customclaw-web-ui:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=customclaw"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/customclaw
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      AIRFLOW_API_URL: http://airflow:8080/api/v2
      AIRFLOW_API_USER: ${AIRFLOW_API_USER}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD}
      AUTH_TRUST_HOST: "true"

  claude-analyzer:
    image: ghcr.io/baekenough/customclaw-slack-bolt:latest
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${CLAUDE_CONFIG_DIR}:${CONTAINER_HOME}/.claude
      - ./docker/bot-claude-settings.json:${CONTAINER_HOME}/.claude/settings.json:ro
      - ${CLAUDE_CREDENTIALS_FILE}:${CONTAINER_HOME}/.claude.json
      - ${CLAUDE_CLI_BINARY}:/usr/local/bin/claude:ro
      - ${HOST_WORKSPACE_PATH}:${CONTAINER_HOME}/workspace
    environment:
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      REPO_PATH: ${CONTAINER_HOME}/workspace/oh-my-customcode
      ANALYZER_CLI: claude
      ANALYZER_STREAM: "customclaw:claude-analysis"
      ANALYZER_GROUP: claude-analyzers
      SLACK_BOT_TOKEN: ${AGENTNAV_CLAUDE_SLACK_BOT_TOKEN}
      SLACK_CHANNEL: ${AGENTNAV_SLACK_CHANNEL}
      HOME: ${CONTAINER_HOME}
      CONTAINER_HOME: ${CONTAINER_HOME}
    command: python -m slack_bot.docs_analyzer

  codex-analyzer:
    image: ghcr.io/baekenough/customclaw-slack-bolt:latest
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${CODEX_CONFIG_DIR}:${CONTAINER_HOME}/.codex
      - ${CODEX_PKG_DIR}:/usr/lib/node_modules/@openai/codex:ro
      - ${HOST_WORKSPACE_PATH}:${CONTAINER_HOME}/workspace
    environment:
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      REPO_PATH: ${CONTAINER_HOME}/workspace/oh-my-customcode
      ANALYZER_CLI: codex
      ANALYZER_STREAM: "customclaw:codex-analysis"
      ANALYZER_GROUP: codex-analyzers
      SLACK_BOT_TOKEN: ${AGENTNAV_CODEX_SLACK_BOT_TOKEN}
      SLACK_CHANNEL: ${AGENTNAV_SLACK_CHANNEL}
      HOME: ${CONTAINER_HOME}
      CONTAINER_HOME: ${CONTAINER_HOME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: python -m slack_bot.docs_analyzer

  gemini-analyzer:
    image: ghcr.io/baekenough/customclaw-slack-bolt:latest
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${GEMINI_CONFIG_DIR}:${CONTAINER_HOME}/.gemini
      - ${GEMINI_NPM_GLOBAL_DIR}:${CONTAINER_HOME}/.npm-global:ro
      - ${HOST_WORKSPACE_PATH}:${CONTAINER_HOME}/workspace
    environment:
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      NODE_PATH: ${CONTAINER_HOME}/.npm-global/lib/node_modules
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${CONTAINER_HOME}/.npm-global/bin
      REPO_PATH: ${CONTAINER_HOME}/workspace/oh-my-customcode
      ANALYZER_CLI: gemini
      ANALYZER_STREAM: "customclaw:gemini-analysis"
      ANALYZER_GROUP: gemini-analyzers
      SLACK_BOT_TOKEN: ${AGENTNAV_GEMINI_SLACK_BOT_TOKEN}
      SLACK_CHANNEL: ${AGENTNAV_SLACK_CHANNEL}
      HOME: ${CONTAINER_HOME}
      CONTAINER_HOME: ${CONTAINER_HOME}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    command: python -m slack_bot.docs_analyzer

  watchtower:
    image: nickfedor/watchtower
    container_name: customclaw-watchtower
    profiles:
      - auto-update
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "${WATCHTOWER_SCHEDULE:-0 0 4 * * *}"
      WATCHTOWER_SCOPE: "customclaw"
      WATCHTOWER_ROLLING_RESTART: "true"
    labels:
      - "com.centurylinklabs.watchtower.scope=customclaw"

volumes:
  pgdata:
  osdata:
  redisdata:
  repos:
