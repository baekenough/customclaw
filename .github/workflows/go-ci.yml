name: Go CI

on:
  push:
    paths:
      - 'go/**'
      - '.github/workflows/go-ci.yml'
    branches: [develop, main]
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go-ci.yml'
    branches: [develop, main]

defaults:
  run:
    working-directory: go

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1 -race -timeout 120s

      - name: Test coverage
        run: |
          go test $(go list ./... | grep -v '/cmd/') -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: go
          args: --timeout=5m

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t customclaw-go:test -f go/Dockerfile go/
