name: Submit Feedback

on:
  workflow_dispatch:
    inputs:
      feedback_type:
        description: 'Type of feedback'
        required: true
        type: choice
        options:
          - bug
          - feature
          - improvement
          - question
      feedback_content:
        description: 'Feedback content'
        required: true
        type: string
      submitter:
        description: 'Submitter name (optional, leave empty for anonymous)'
        required: false
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Feedback DAG
        env:
          AIRFLOW_API_URL: ${{ secrets.AIRFLOW_API_URL }}
          AIRFLOW_API_USER: ${{ secrets.AIRFLOW_API_USER }}
          AIRFLOW_API_PASSWORD: ${{ secrets.AIRFLOW_API_PASSWORD }}
          FEEDBACK_TYPE: ${{ inputs.feedback_type }}
          FEEDBACK_CONTENT: ${{ inputs.feedback_content }}
          FEEDBACK_SUBMITTER: ${{ inputs.submitter }}
        run: |
          set -euo pipefail

          BASE_URL="${AIRFLOW_API_URL%/api/v[0-9]*}"

          TOKEN_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${BASE_URL}/auth/token" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${AIRFLOW_API_USER}\", \"password\": \"${AIRFLOW_API_PASSWORD}\"}")
          TOKEN_HTTP=$(echo "${TOKEN_RESPONSE}" | tail -n1)
          TOKEN_BODY=$(echo "${TOKEN_RESPONSE}" | head -n-1)

          if [ "${TOKEN_HTTP}" != "201" ]; then
            echo "Error: Failed to obtain Airflow token"
            exit 1
          fi

          ACCESS_TOKEN=$(echo "${TOKEN_BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          CONF=$(python3 -c "
          import json, os
          print(json.dumps({
            'feedback_type': os.environ['FEEDBACK_TYPE'],
            'feedback_content': os.environ['FEEDBACK_CONTENT'],
            'submitter': os.environ['FEEDBACK_SUBMITTER']
          }))
          ")

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${BASE_URL}/api/v2/dags/omc_feedback_collector/dagRuns" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"dag_run_id\": \"feedback_$(date +%s)\",
              \"logical_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"conf\": ${CONF}
            }")
          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Error: Feedback submission failed"
            exit 1
          fi

          echo "Feedback submitted successfully"
