name: Build & Push Docker Images

on:
  push:
    branches: [main, develop]
    tags: ["v*"]

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go build
        working-directory: go
        run: go build ./...

      - name: Go test
        working-directory: go
        run: go test ./... -count=1 -timeout 120s

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web-UI type check
        working-directory: web-ui
        run: |
          npm ci
          npx tsc --noEmit

  build:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: platform-adapter
            dockerfile: docker/platform-adapter/Dockerfile
            context: "."
          - service: web-ui
            dockerfile: docker/web-ui/Dockerfile
            context: "."
          - service: airflow
            dockerfile: docker/airflow/Dockerfile
            context: "."
          - service: opensearch
            dockerfile: docker/opensearch/Dockerfile
            context: docker/opensearch
          - service: go-worker
            dockerfile: go/Dockerfile
            context: go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tags
        id: tags
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE="${ECR_REGISTRY}/customclaw/${{ matrix.service }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${IMAGE}:${SHA_SHORT}"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            TAGS="${TAGS},${IMAGE}:develop"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
