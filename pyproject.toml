[project]
name = "customclaw"
version = "0.2.0"
description = "AI multi-platform bot management with LLM support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "opensearch-py>=2.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.18.0", "slack-sdk>=3.27.0"]
discord = ["discord.py>=2.3.0"]
mattermost = ["mattermostdriver>=7.3.2"]
all-platforms = [
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "discord.py>=2.3.0",
    "mattermostdriver>=7.3.2",
]

[project.urls]
Repository = "https://github.com/baekenough/customclaw"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
