[project]
name = "customclaw"
version = "0.1.0"
description = "AI Slack bot management platform with multi-provider LLM support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "anthropic>=0.39.0",
    "voyageai>=0.3.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "httpx>=0.27.0",
    "opensearch-py>=2.4.0",
    "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/baekenough/customclaw"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
