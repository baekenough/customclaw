services:
  go-worker:
    build:
      context: ./go
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_DSN: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/customclaw"
      BOTS_DIR: /app/bots
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      MAX_CONCURRENT_WORKERS: "10"
      MERGE_WINDOW_SECONDS: "30"
      # Claude CLI subprocess mode
      CONTAINER_HOME: /home/appuser
      CLAUDE_CLI_PATH: /usr/local/bin/claude
      # LLM provider API keys (fallback when Claude CLI is unavailable)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ../bots:/app/bots:ro
      # Claude CLI binary mounted from host (resolved at deploy time via CLAUDE_CLI_PATH env var)
      - ${CLAUDE_CLI_PATH:-/usr/local/bin/claude}:/usr/local/bin/claude:ro
      # Claude credentials directory: rw required for OAuth token refresh
      - ${CLAUDE_CONFIG_DIR:-/home/baekenough/.claude}:/home/appuser/.claude:rw
      # Target repos for FullAgent analysis (read-only for security)
      - /home/baekenough/workspace:/workspace:ro
    entrypoint: ["worker"]

  go-app:
    build:
      context: ./go
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_DSN: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/customclaw"
      BOTS_DIR: /app/bots
    volumes:
      - ../bots:/app/bots:ro
    entrypoint: ["app"]
